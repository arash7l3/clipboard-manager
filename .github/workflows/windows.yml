name: Windows

on:
  push:
    branches: [main]
  pull_request:

# The token can only read the repository; no job here writes to GitHub.
permissions:
  contents: read

# Cancel superseded runs of the same branch/PR.
concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  DOTNET_NOLOGO: 1
  DOTNET_CLI_TELEMETRY_OPTOUT: 1
  # The vendored OpenSSL must be configured by Strawberry Perl, not Git's MSYS Perl.
  OPENSSL_SRC_PERL: C:\Strawberry\perl\bin\perl.exe

# Runs on GitHub's hosted Windows runner, free for this public repository.
# Its caches stay inside GitHub, so they don't go over the self-hosted Mac's
# link. The Mac jobs are in ci.yml; deleting this file leaves them as they were.

jobs:
  windows:
    name: Windows app
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - name: Rust toolchain
        run: |
          rustup show active-toolchain
          rustc --version

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: core

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: NuGet cache
        uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('windows/**/*.csproj', 'windows/Directory.Packages.props') }}
          restore-keys: nuget-${{ runner.os }}-

      # The C# bindings against a debug build of the core.
      - name: C# smoke test
        working-directory: core
        run: cargo xtask smoke csharp

      # x64 only, to keep CI short; `cargo xtask package windows` builds arm64 too.
      - name: Package the core
        working-directory: core
        run: cargo xtask package windows --target x86_64-pc-windows-msvc

      # Style gate: analyzers already fail the build; this checks whitespace.
      - name: Format check
        working-directory: windows
        shell: bash
        run: |
          for project in Clipo.Services Clipo.Tests Clipo; do
            dotnet format whitespace "$project/$project.csproj" --verify-no-changes
          done

      - name: Test
        working-directory: windows
        run: dotnet test Clipo.Tests/Clipo.Tests.csproj -c Release

      - name: Build the app
        working-directory: windows
        run: dotnet publish Clipo/Clipo.csproj -c Release -r win-x64 -p:Platform=x64 --self-contained -o "${{ runner.temp }}/Clipo-win-x64"

      # Download from the run's summary page, unzip and run Clipo.exe.
      - name: Upload the app
        uses: actions/upload-artifact@v7
        with:
          name: Clipo-win-x64
          path: ${{ runner.temp }}/Clipo-win-x64
          retention-days: 14
