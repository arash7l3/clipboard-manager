name: CI

on:
  push:
    branches: [main]
  pull_request:

# The token can only read the repository; no job here writes to GitHub.
permissions:
  contents: read

# Cancel superseded runs of the same branch/PR.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

# No GitHub cache actions: the self-hosted Mac keeps ~/.cargo between runs, and
# build output goes to ~/Library/Caches/clipo-ci, outside the work folder that
# checkout cleans. Nothing is uploaded or downloaded for caching.

jobs:
  core:
    name: Rust core
    runs-on: [self-hosted, macOS, clipboard-manager]
    # Code from forks never runs on the self-hosted Mac, which keeps state
    # between runs and will hold the signing identity. A fork could edit this
    # line too, so the repository's approval setting for outside
    # contributors stays the first guard.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      # Steps are guarded so the workflow stays green until the crate exists (Phase 1).
      - name: Check for Rust crate
        id: crate
        run: echo "exists=${{ hashFiles('core/Cargo.toml') != '' }}" >> "$GITHUB_OUTPUT"

      # Uses the Rust installed on the runner: no network call per run.
      # Update it on the Mac with `rustup update`. The Apple targets are for
      # the universal library in the Swift smoke test; added only if missing.
      - name: Use installed Rust toolchain
        if: steps.crate.outputs.exists == 'true'
        run: |
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.cargo/bin:$PATH"
          echo "CARGO_TARGET_DIR=$HOME/Library/Caches/clipo-ci/target" >> "$GITHUB_ENV"
          rustc --version
          cargo fmt --version
          cargo clippy --version
          for target in aarch64-apple-darwin x86_64-apple-darwin; do
            rustup target list --installed | grep -qx "$target" || rustup target add "$target"
          done

      - name: rustfmt
        if: steps.crate.outputs.exists == 'true'
        run: cargo fmt --manifest-path core/Cargo.toml --all -- --check

      - name: clippy
        if: steps.crate.outputs.exists == 'true'
        run: cargo clippy --manifest-path core/Cargo.toml --workspace --all-targets --all-features -- -D warnings

      - name: Test
        if: steps.crate.outputs.exists == 'true'
        run: cargo test --manifest-path core/Cargo.toml --workspace --all-features

      # Swift and C# bindings both generate (the Phase 1 exit check).
      - name: Generate bindings
        if: steps.crate.outputs.exists == 'true'
        working-directory: core
        run: cargo xtask bindings

      # Packages the universal static library and runs Swift code against it.
      - name: Swift smoke test
        if: steps.crate.outputs.exists == 'true'
        working-directory: core
        run: cargo xtask smoke swift

      # The Mac runner may not have .NET; the Windows job (Phase 3) will.
      - name: C# smoke test
        if: steps.crate.outputs.exists == 'true'
        working-directory: core
        run: |
          if command -v dotnet >/dev/null; then
            cargo xtask smoke csharp
          else
            echo "::notice::dotnet is not installed on this runner; C# smoke test skipped"
          fi

  macos:
    name: macOS app
    needs: core
    runs-on: [self-hosted, macOS, clipboard-manager]
    # No forks on the Mac, as for the core job.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Check for Xcode project
        id: xcode
        run: echo "exists=${{ hashFiles('macos/**/project.pbxproj') != '' }}" >> "$GITHUB_OUTPUT"

      # Uses the Rust installed on the runner; adds a missing target only if needed.
      - name: Use installed Rust toolchain
        if: steps.xcode.outputs.exists == 'true'
        run: |
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.cargo/bin:$PATH"
          echo "CARGO_TARGET_DIR=$HOME/Library/Caches/clipo-ci/target" >> "$GITHUB_ENV"
          rustc --version
          for target in aarch64-apple-darwin x86_64-apple-darwin; do
            rustup target list --installed | grep -qx "$target" || rustup target add "$target"
          done

      # The Xcode project links core/dist/apple/ClipoCore as a local package,
      # so it has to exist before Xcode resolves packages.
      - name: Package the core
        if: steps.xcode.outputs.exists == 'true'
        working-directory: core
        run: cargo xtask package macos

      # Homebrew's bin folders may be missing from the runner service's PATH.
      # Installed once if missing; it stays on the self-hosted runner.
      - name: SwiftLint
        if: steps.xcode.outputs.exists == 'true'
        working-directory: macos
        env:
          HOMEBREW_NO_AUTO_UPDATE: 1
          HOMEBREW_NO_INSTALL_CLEANUP: 1
        run: |
          export PATH="/opt/homebrew/bin:/usr/local/bin:$PATH"
          if ! command -v swiftlint >/dev/null; then
            if ! command -v brew >/dev/null; then
              echo "::error::SwiftLint and Homebrew are missing on the runner; install SwiftLint on the Mac"
              exit 1
            fi
            brew install swiftlint
          fi
          swiftlint version
          swiftlint lint --strict --quiet

      - name: Build and test
        if: steps.xcode.outputs.exists == 'true'
        working-directory: macos
        run: |
          set -o pipefail
          xcodebuild -version
          xcodebuild test \
            -project Clipo.xcodeproj \
            -scheme Clipo \
            -destination 'platform=macOS' \
            -derivedDataPath "$HOME/Library/Caches/clipo-ci/DerivedData" \
            -clonedSourcePackagesDirPath "$HOME/Library/Caches/clipo-ci/DerivedData/SourcePackages" \
            CODE_SIGNING_ALLOWED=NO

  # Windows (WinUI/WPF) needs a windows-latest or self-hosted Windows runner; add in Phase 3.
