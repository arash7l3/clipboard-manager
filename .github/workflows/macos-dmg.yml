name: macOS dmg

# A v* tag or a manual run builds the dmg and uploads it. Pull requests that
# touch the packaging build it too, to check the script, but upload nothing:
# uploads go over the self-hosted Mac's slow link.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
  pull_request:
    paths:
      - macos/scripts/**
      - .github/workflows/macos-dmg.yml

# The token can only read the repository; no job here writes to GitHub.
permissions:
  contents: read

concurrency:
  group: macos-dmg-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  dmg:
    name: macOS dmg
    runs-on: [self-hosted, macOS, clipboard-manager]
    # Code from forks never runs on the self-hosted Mac, which keeps state
    # between runs and will hold the signing identity. A fork could edit this
    # line too, so the repository's approval setting for outside
    # contributors stays the first guard.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      # Same toolchain setup as ci.yml: the Rust installed on the runner.
      - name: Use installed Rust toolchain
        run: |
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.cargo/bin:$PATH"
          echo "CARGO_TARGET_DIR=$HOME/Library/Caches/clipo-ci/target" >> "$GITHUB_ENV"
          rustc --version
          for target in aarch64-apple-darwin x86_64-apple-darwin; do
            rustup target list --installed | grep -qx "$target" || rustup target add "$target"
          done

      - name: Package the core
        working-directory: core
        run: cargo xtask package macos

      # The Developer ID and the notary credentials stay in the Mac's keychain;
      # the repository variables only name them (decision 0023). Unset, or on
      # a pull request, the dmg gets an ad-hoc signature.
      - name: Build the dmg
        env:
          CLIPO_SIGN_IDENTITY: ${{ github.event_name != 'pull_request' && vars.CLIPO_SIGN_IDENTITY || '' }}
          CLIPO_NOTARY_PROFILE: ${{ github.event_name != 'pull_request' && vars.CLIPO_NOTARY_PROFILE || '' }}
        run: |
          if [[ $GITHUB_REF == refs/tags/v* ]]; then
            export CLIPO_EXPECT_VERSION="${GITHUB_REF_NAME#v}"
          fi
          export CLIPO_DERIVED_DATA="$HOME/Library/Caches/clipo-ci/DerivedData-release"
          macos/scripts/make-dmg.sh "$RUNNER_TEMP/clipo-dmg"

      - name: Upload the dmg
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: Clipo-macos-dmg
          path: ${{ runner.temp }}/clipo-dmg
          retention-days: 30
          compression-level: 0
