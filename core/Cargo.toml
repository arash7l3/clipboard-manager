# The core crate is the workspace root. `ffi` exports it to Swift and C# through
# UniFFI; `xtask` generates the bindings and packages the libraries
# (`cargo xtask --help`).
[workspace]
members = ["ffi", "xtask"]

[workspace.package]
edition = "2021"
rust-version = "1.89"
license = "UNLICENSED"
publish = false

# Bindings generators and the scaffolding must come from the same UniFFI
# release; uniffi-bindgen-cs v0.11.1 targets UniFFI 0.31.
[workspace.dependencies]
clipo-core = { path = "." }
uniffi = "0.31"
uniffi_bindgen = "0.31"
uniffi-bindgen-cs = { git = "https://github.com/NordSecurity/uniffi-bindgen-cs", tag = "v0.11.1+v0.31.0" }

[workspace.lints.rust]
unsafe_code = "deny"
missing_docs = "warn"
unreachable_pub = "warn"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"

[package]
name = "clipo-core"
version = "0.1.0"
description = "Shared engine for Clipo: clipboard history model, store and rules. No UI."
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lib]
name = "clipo_core"

[dependencies]
getrandom = "0.4"
sha2 = "0.10"
thiserror = "2"
zeroize = "1"

# SQLCipher (whole-file encryption, see docs/decisions/0007). Apple targets use
# CommonCrypto; everything else builds a vendored OpenSSL so no system copy is needed.
[target.'cfg(target_vendor = "apple")'.dependencies]
rusqlite = { version = "0.41", default-features = false, features = ["bundled-sqlcipher", "cache", "functions"] }

[target.'cfg(not(target_vendor = "apple"))'.dependencies]
rusqlite = { version = "0.41", default-features = false, features = ["bundled-sqlcipher-vendored-openssl", "cache", "functions"] }

[lints]
workspace = true

[dev-dependencies]
tempfile = "3"
